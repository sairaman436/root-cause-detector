# Purpose: Defines autoscaling policy for latency-sensitive platform workloads.
# Why it exists: Allows horizontal scaling based on CPU while preserving conservative minimum capacity.
# Architecture fit: Supports Milestone 11 high availability and scaling strategy.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-backend
  namespace: airural-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-backend
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-portal
  namespace: airural-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-portal
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
