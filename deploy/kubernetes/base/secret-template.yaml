# Purpose: Documents the Kubernetes Secret contract without committing secret values.
# Why it exists: Allows GitOps and operators to validate required keys while sourcing values from Vault or cloud secret managers.
# Architecture fit: Supports Milestone 11 secrets rotation, TLS, and supply-chain-safe configuration.
apiVersion: v1
kind: Secret
metadata:
  name: airural-platform-secrets
  namespace: airural-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-through-vault
  JWT_SIGNING_SECRET: replace-through-vault
  MINIO_ROOT_PASSWORD: replace-through-vault
  GRAFANA_ADMIN_PASSWORD: replace-through-vault
