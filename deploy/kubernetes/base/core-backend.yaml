# Purpose: Runs the Spring Boot core backend as a horizontally scalable Kubernetes workload.
# Why it exists: Provides production probes, resource controls, config injection, and graceful rollout behavior.
# Architecture fit: Implements Milestone 11 backend container, health check, high availability, and observability requirements.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-backend
  namespace: airural-platform
  labels:
    app.kubernetes.io/name: core-backend
    app.kubernetes.io/part-of: airural-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: core-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-backend
        app.kubernetes.io/part-of: airural-platform
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: '8081'
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: core-backend
          image: ghcr.io/sairaman436/root-cause-detector/core-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: management
          envFrom:
            - configMapRef:
                name: airural-platform-config
            - secretRef:
                name: airural-platform-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: '2'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ['ALL']
---
apiVersion: v1
kind: Service
metadata:
  name: core-backend
  namespace: airural-platform
spec:
  selector:
    app.kubernetes.io/name: core-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 8081
      targetPort: management
