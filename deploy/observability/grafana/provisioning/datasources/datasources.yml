# Purpose: Provisions Grafana datasources for metrics, logs, and traces.
# Why it exists: Makes dashboards reproducible across environments.
# Architecture fit: Supports Milestone 11 Grafana, Loki, Tempo, and Prometheus integration.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
