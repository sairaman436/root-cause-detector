# Purpose: Configures Loki for production log aggregation.
# Why it exists: Provides searchable structured logs for incidents, audit review, and compliance evidence.
# Architecture fit: Supports Milestone 11 centralized logging and incident response.
auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  filesystem:
    directory: /loki/chunks
limits_config:
  retention_period: 30d
