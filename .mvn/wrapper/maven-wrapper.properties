# Purpose: Defines the Maven distribution used by the repository wrapper.
# Why it exists: Allows Java builds to run without requiring a globally installed Maven binary.
# Architecture fit: Supports deterministic Spring Boot backend validation for the approved Java 21 backend foundation.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.4/maven-wrapper-3.3.4.jar
