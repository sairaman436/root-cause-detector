# Purpose: Runs baseline repository security checks.
# Why it exists: Establishes secret, dependency, and supply-chain scanning gates before production code exists.
# Architecture fit: Supports the approved Security & Governance and Supply Chain Security architecture.
name: Security Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
