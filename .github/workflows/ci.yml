# Purpose: Runs the repository-wide CI quality entry point.
# Why it exists: Provides a single foundation workflow that validates formatting and routes deeper checks by stack.
# Architecture fit: Implements the approved CI/CD layout for monorepo governance before business implementation begins.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  repository-quality:
    name: Repository Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Validate Compose configuration
        run: docker compose config --quiet
