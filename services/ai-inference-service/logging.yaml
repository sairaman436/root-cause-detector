# Purpose: Defines baseline structured logging intent for the AI inference service.
# Why it exists: Ensures future model-serving logs include service metadata suitable for centralized observability.
# Architecture fit: Supports AI platform monitoring without implementing inference logic.
version: 1
disable_existing_loggers: false
formatters:
  structured:
    format: '%(asctime)s %(levelname)s %(name)s %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    formatter: structured
root:
  level: INFO
  handlers:
    - console
