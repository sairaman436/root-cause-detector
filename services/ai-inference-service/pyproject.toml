# Purpose: Defines Python dependency and tooling configuration for the AI inference service.
# Why it exists: Establishes FastAPI, testing, typing, and linting foundations before prediction workflows are implemented.
# Architecture fit: Supports the approved separation where Python services own ML inference and explainability.

[project]
name = "ai-inference-service"
version = "0.1.0"
description = "AI inference service foundation for model serving; no prediction implementation is included in Milestone 1."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "structlog>=24.2.0"
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
sonar = [
  "huggingface-hub>=0.24.0",
  "sonar-space==0.5.0; python_version < '3.14'",
  "torch>=2.2.0",
  "transformers>=4.45.0",
  "sentencepiece>=0.2.0"
]
benchmark = [
  "psutil>=6.0.0"
]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.10.0",
  "ruff>=0.5.5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
