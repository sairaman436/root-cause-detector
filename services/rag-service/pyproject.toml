# Purpose: Defines Python dependency and tooling configuration for the RAG service.
# Why it exists: The RAG boundary owns trusted document parsing, chunking, retrieval, citation validation, and LLM-grounded answers.
# Architecture fit: Supports the approved AI Platform Design where knowledge retrieval is separate from prediction and reasoning.

[project]
name = "rag-service"
version = "1.0.0"
description = "Enterprise RAG service for trusted knowledge ingestion, hybrid retrieval, and citation-grounded answers."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "structlog>=24.2.0",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2"
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.10.0",
  "ruff>=0.5.5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
