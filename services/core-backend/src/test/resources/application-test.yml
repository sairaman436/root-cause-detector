# Purpose: Provides isolated database settings for backend tests.
# Why it exists: Allows identity integration tests to run Flyway without requiring Docker or a live PostgreSQL instance.
# Architecture fit: Keeps production runtime on PostgreSQL while making CI tests deterministic.
spring:
  datasource:
    url: jdbc:h2:mem:airural_identity_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: identity,audit,survey,evidence,geospatial,eventing,ai,agents,decision,operations,datasets,knowledge
    default-schema: identity
    create-schemas: true

airural:
  security:
    jwt:
      issuer: airural-platform-test
      secret: test-development-secret-must-be-rotated-before-production-32-bytes-minimum
      access-token-minutes: 15
      refresh-token-days: 7
