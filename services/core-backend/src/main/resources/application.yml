# Purpose: Defines baseline Spring Boot runtime configuration for the core backend.
# Why it exists: Establishes environment-driven configuration, actuator exposure, and structured logging conventions before feature modules exist.
# Architecture fit: Supports the approved backend service design, observability architecture, and configuration management strategy.
spring:
  application:
    name: core-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    banner-mode: 'off'
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:airural}
    username: ${POSTGRES_USER:airural}
    password: ${POSTGRES_PASSWORD:airural_local_only}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: identity,audit,survey,evidence,geospatial,eventing,ai
    default-schema: identity
    create-schemas: true

management:
  server:
    port: ${CORE_BACKEND_MANAGEMENT_PORT:${CORE_BACKEND_PORT:8080}}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.airural: INFO
  pattern:
    correlation: ${CORRELATION_ID_PATTERN:%X{traceId:-}}

server:
  port: ${CORE_BACKEND_PORT:8080}

airural:
  security:
    jwt:
      issuer: ${JWT_ISSUER:airural-platform}
      secret: ${JWT_SIGNING_SECRET:local-development-secret-must-be-rotated-before-production-32-bytes-minimum}
      access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
      refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
  evidence:
    local-storage-path: ${EVIDENCE_LOCAL_STORAGE_PATH:./var/evidence}
    max-file-size-bytes: ${EVIDENCE_MAX_FILE_SIZE_BYTES:52428800}
    allowed-mime-types: ${EVIDENCE_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp,video/mp4,audio/mpeg,audio/wav,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/gpx+xml,application/geo+json,text/plain,application/octet-stream}
  events:
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
      client-id: ${KAFKA_CLIENT_ID:core-backend}
      consumer-group: ${KAFKA_CONSUMER_GROUP:core-backend-event-consumers}
      enabled: ${EVENT_PUBLISHING_ENABLED:false}
      consumers-enabled: ${EVENT_CONSUMERS_ENABLED:false}
    outbox:
      poll-ms: ${OUTBOX_POLL_MS:5000}
      batch-size: ${OUTBOX_BATCH_SIZE:50}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
  ai:
    gateway:
      default-model: ${AI_DEFAULT_MODEL:qwen2.5-local}
      ollama-url: ${OLLAMA_URL:http://localhost:11434}
      vllm-url: ${VLLM_URL:http://localhost:8000}
    qdrant:
      url: ${QDRANT_URL:http://localhost:6333}
    embedding:
      chunk-chars: ${AI_EMBEDDING_CHUNK_CHARS:900}
      vector-size: ${AI_EMBEDDING_VECTOR_SIZE:16}
    safety:
      max-prompt-chars: ${AI_MAX_PROMPT_CHARS:12000}

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs
