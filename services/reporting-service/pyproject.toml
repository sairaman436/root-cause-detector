# Purpose: Defines Python dependency and tooling configuration for the reporting service.
# Why it exists: Establishes a runnable reporting service shell before report-generation workflows are implemented.
# Architecture fit: Supports independently scalable reporting and export workflows in the approved service topology.

[project]
name = "reporting-service"
version = "0.1.0"
description = "Sprint 1 reporting service with CSV and PDF rendering."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "structlog>=24.2.0"
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.10.0",
  "ruff>=0.5.5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
