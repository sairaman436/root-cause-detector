# Purpose: Defines the local development runtime for platform services and dependencies.
# Why it exists: Gives developers one command to build and start every operational service shell with shared infrastructure.
# Architecture fit: Mirrors the approved production topology at local scale without implementing business features.
name: ai-rural-root-cause-platform

x-service-env: &service-env
  env_file:
    - ./config/env/local.example.env
  networks:
    - platform

services:
  core-backend:
    <<: *service-env
    build:
      context: .
      dockerfile: services/core-backend/Dockerfile
    environment:
      CORE_BACKEND_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: airural
      POSTGRES_USER: airural
      POSTGRES_PASSWORD: airural_local_only
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENT_PUBLISHING_ENABLED: true
      EVENT_CONSUMERS_ENABLED: true
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      JWT_SIGNING_SECRET: local-development-secret-must-be-rotated-before-production-32-bytes-minimum
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
      object-storage:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/actuator/health | grep -q UP']
      interval: 10s
      timeout: 5s
      retries: 12

  web-portal:
    <<: *service-env
    build:
      context: .
      dockerfile: apps/web-portal/Dockerfile
    environment:
      PORT: 3000
      CORE_BACKEND_URL: http://core-backend:8080
    ports:
      - '3000:3000'
    depends_on:
      core-backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 12

  admin-portal:
    <<: *service-env
    build:
      context: .
      dockerfile: apps/admin-portal/Dockerfile
    environment:
      PORT: 3001
      CORE_BACKEND_URL: http://core-backend:8080
    ports:
      - '3001:3001'
    depends_on:
      core-backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/health | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 12

  ai-inference-service:
    <<: *service-env
    build:
      context: ./services/ai-inference-service
    environment:
      APP_ENV: local
      PORT: 8101
    ports:
      - '8101:8101'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8101/health/ready'', timeout=2).read()"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  rag-service:
    <<: *service-env
    build:
      context: ./services/rag-service
    environment:
      APP_ENV: local
      PORT: 8102
    ports:
      - '8102:8102'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8102/health/ready'', timeout=2).read()"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  agent-orchestrator:
    <<: *service-env
    build:
      context: ./services/agent-orchestrator
    environment:
      APP_ENV: local
      PORT: 8103
    ports:
      - '8103:8103'
    depends_on:
      ai-inference-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8103/health/ready'', timeout=2).read()"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  reporting-service:
    <<: *service-env
    build:
      context: ./services/reporting-service
    environment:
      APP_ENV: local
      PORT: 8104
    ports:
      - '8104:8104'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8104/health/ready'', timeout=2).read()"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  notification-service:
    <<: *service-env
    build:
      context: ./services/notification-service
    environment:
      APP_ENV: local
      PORT: 8105
    ports:
      - '8105:8105'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8105/health/ready'', timeout=2).read()"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airural
      POSTGRES_USER: airural
      POSTGRES_PASSWORD: airural_local_only
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - platform
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U airural -d airural']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    networks:
      - platform

  kafka:
    image: redpandadata/redpanda:v24.1.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - '1'
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - '0'
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092,OUTSIDE://localhost:19092
    ports:
      - '9092:9092'
      - '19092:19092'
      - '9644:9644'
    volumes:
      - kafka-data:/var/lib/redpanda/data
    networks:
      - platform

  object-storage:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: airural
      MINIO_ROOT_PASSWORD: airural_local_only
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    networks:
      - platform

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - platform

  ollama:
    image: ollama/ollama:0.3.4
    ports:
      - '11434:11434'
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - platform

  prometheus:
    image: prom/prometheus:v2.53.1
    ports:
      - '9090:9090'
    volumes:
      - ./deploy/configmaps/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - platform

networks:
  platform:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
  qdrant-data:
  ollama-data:
