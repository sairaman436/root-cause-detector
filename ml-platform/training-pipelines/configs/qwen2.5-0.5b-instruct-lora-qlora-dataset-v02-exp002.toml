# Purpose: Pins the single controlled Qwen QLoRA Experiment 002.
# Why it exists: Experiment 002 must consume only the immutable dataset-v0.2 snapshot and write a new adapter.
# Architecture fit: Isolated MLOps worker configuration; it never changes the base model or live review data.

[experiment]
name = "qwen2.5-0.5b-instruct-dataset-v0.2-experiment-002"
seed = 42
dataset_version = "dataset-v0.2"
dataset_dir = "ml-platform/training-pipelines/dataset-v0.2"
output_dir = "artifacts/training/qwen2.5-0.5b-instruct-dataset-v0.2/experiment-002"
report_path = "FINE_TUNING_EXPERIMENT_002.md"
resume_from_checkpoint = ""

[model]
base_model = "Qwen/Qwen2.5-0.5B-Instruct"
model_family = "QWEN"
trust_remote_code = false
torch_dtype = "bfloat16"

[data]
sequence_length = 1024
train_files = ["root-cause-analysis.jsonl", "recommendation-generation.jsonl", "rag-grounded-responses.jsonl"]
validation_files = ["root-cause-analysis.jsonl", "recommendation-generation.jsonl", "rag-grounded-responses.jsonl"]
test_files = ["root-cause-analysis.jsonl", "recommendation-generation.jsonl", "rag-grounded-responses.jsonl"]

[training]
batch_size = 1
gradient_accumulation_steps = 8
learning_rate = 0.0002
epochs = 1
warmup_ratio = 0.03
max_grad_norm = 1.0
gradient_checkpointing = true
logging_steps = 1
evaluation_steps = 10
save_steps = 10

[lora]
rank = 16
alpha = 32
dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]

[quantization]
method = "qlora_4bit"
double_quantization = true
quant_type = "nf4"
compute_dtype = "bfloat16"

[reproducibility]
deterministic_algorithms = true

[checkpoint]
resume_supported = true
save_optimizer_state = true
save_tokenizer = true
save_metadata = true
