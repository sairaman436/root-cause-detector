# Purpose: Provides a non-production GPU readiness smoke-test profile.
# Why it exists: The production dataset-v0.1 is empty and must remain unchanged; GPU validation needs an explicit development-only dataset boundary.
# Architecture fit: Exercises the approved Qwen LoRA/QLoRA pipeline with synthetic examples without enabling training or changing production configuration.

[experiment]
name = "qwen2.5-0.5b-instruct-dataset-v0.1-dev-synthetic-gpu-readiness"
seed = 42
dataset_version = "dataset-v0.1-dev-synthetic"
dataset_dir = "ml-platform/training-pipelines/dataset-v0.1-dev-synthetic"
output_dir = ".venv-training-gpu/smoke-output/qwen2.5-0.5b-instruct-dataset-v0.1-dev-synthetic"
resume_from_checkpoint = ""

[model]
base_model = "Qwen/Qwen2.5-0.5B-Instruct"
model_family = "QWEN"
trust_remote_code = false
torch_dtype = "float16"

[data]
sequence_length = 256
train_files = ["root-cause-analysis.jsonl", "recommendation-generation.jsonl", "rag-grounded-responses.jsonl"]
validation_files = ["root-cause-analysis.jsonl", "recommendation-generation.jsonl", "rag-grounded-responses.jsonl"]

[training]
batch_size = 1
gradient_accumulation_steps = 1
learning_rate = 0.0002
epochs = 1
warmup_ratio = 0.0
max_grad_norm = 1.0
gradient_checkpointing = false
logging_steps = 1
evaluation_steps = 1
save_steps = 1

[lora]
rank = 8
alpha = 16
dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]

[quantization]
method = "qlora_4bit"
double_quantization = true
quant_type = "nf4"
compute_dtype = "float16"

[reproducibility]
deterministic_algorithms = true

[checkpoint]
resume_supported = true
save_optimizer_state = true
save_tokenizer = true
save_metadata = true
